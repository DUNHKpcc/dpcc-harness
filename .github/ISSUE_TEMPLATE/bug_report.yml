name: Bug 反馈
description: 提交一个可复现的问题，帮助我们定位和修复。
title: "[Bug]: "
labels: ["bug", "status: needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽可能完整填写以下内容；信息越充分，我们越能更快定位和修复问题。
        请勿提交 API Key、Token、密码、Cookie、设备凭据或包含个人信息的完整日志。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简要地说明发生了什么问题。
      placeholder: 请描述异常现象...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能稳定复现该问题的操作步骤。
      placeholder: |
        1. 打开使用“...”的会话
        2. 发送消息“...”
        3. 点击“...”
        4. 看到异常
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本希望发生什么？
      placeholder: 请描述预期结果...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？可附上错误信息或截图。
      placeholder: 请描述实际结果...
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Agent 运行环境
      description: 出现问题时正在使用哪种运行环境？
      multiple: true
      options:
        - Pi（内置 ACP agent）
        - 自定义 ACP agent
        - 历史 Claude/Codex 会话（只读）
        - 与运行环境无关
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 你正在使用哪个操作系统？
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PccAgent 版本
      description: 可在标题栏或“关于”页面查看，例如 `0.9.0`。
      placeholder: "0.x.x"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: PccAgent 的哪个部分受影响？可多选。
      multiple: true
      options:
        - 聊天 / 消息
        - 工具渲染
        - MCP 工具
        - 终端
        - Git 面板
        - 浏览器面板
        - 文件面板
        - 会话管理
        - 设置
        - 侧边栏 / 导航
        - 后台 Agent
        - UI / 布局
        - 构建 / 安装
        - 其他

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误输出
      description: |
        请粘贴相关日志。**提交前务必删除 API Key、Token、密码、包含个人信息的路径和其他敏感数据。**

        **日志位置**（文件名为 `main-{timestamp}.log`；请附上最新且已脱敏的文件）：
        - macOS：`~/Library/Application Support/PccAgent/logs/`
        - Windows：`%APPDATA%\PccAgent\logs\`
        - Linux：`~/.config/PccAgent/logs/`
      render: text
      placeholder: 请在此粘贴已脱敏的日志...

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可补充其他有助于定位的问题背景、截图或信息。
      placeholder: 还有其他需要说明的吗？
