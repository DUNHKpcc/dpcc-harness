name: 功能建议
description: 提交一个新功能或改进建议。
title: "[Feature]: "
labels: ["enhancement", "status: needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。请尽可能详细填写以下内容，帮助我们理解真实的工作流和需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 这个建议是否源于某个问题？请清楚说明。
      placeholder: |
        我经常因为……而受阻。
        目前无法……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望看到的功能，越具体越好。
      placeholder: |
        我希望增加一个按钮 / 面板 / 设置，用于……
        当我执行 X 时，PccAgent 应该……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 你是否尝试过其他方案或临时绕过方式？
      placeholder: 我尝试过 X，但它无法解决问题，因为……

  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      description: 此功能与 PccAgent 的哪个部分相关？可多选。
      multiple: true
      options:
        - 聊天 / 消息
        - 工具渲染
        - MCP 工具 / 集成
        - 终端
        - Git 面板
        - 浏览器面板
        - 文件面板
        - 会话管理
        - 设置
        - 侧边栏 / 导航
        - 后台 Agent
        - UI / 布局 / 设计
        - 构建 / 安装
        - ACP agent 支持
        - 其他

  - type: dropdown
    id: engine
    attributes:
      label: 相关 Agent
      description: 此功能是否仅与特定 ACP agent 有关？
      multiple: true
      options:
        - Pi（内置 ACP agent）
        - 自定义 ACP agent
        - 所有 ACP agent
        - 与 Agent 无关

  - type: dropdown
    id: priority
    attributes:
      label: 此功能对你有多重要？
      options:
        - 有了更好
        - 能显著改善我的工作流
        - 阻碍我使用 PccAgent
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      description: 你是否愿意参与实现此功能？
      options:
        - label: 我愿意为此功能提交 PR

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可补充背景、原型、截图或示例，帮助说明该功能。
      placeholder: 还有其他需要说明的吗？
