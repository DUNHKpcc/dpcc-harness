<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PccAgent</title>
    <style>
      html, body {
        background-color: transparent !important;
      }
    </style>
    <!-- Apply theme class before first paint to prevent flash of wrong theme.
         Runs after <html> exists but before CSS renders the first frame. -->
    <script>
      (function() {
        var stored;
        try {
          var persisted = localStorage.getItem("pcc-agent-settings-store");
          if (persisted) {
            var parsed = JSON.parse(persisted);
            var candidate = parsed && parsed.state && parsed.state.theme;
            if (candidate === "light" || candidate === "dark" || candidate === "system") {
              stored = candidate;
            }
            var accentCandidate = parsed && parsed.state && parsed.state.accentColor;
            if (typeof accentCandidate === "string" && /^#[0-9a-f]{6}$/i.test(accentCandidate)) {
              document.documentElement.style.setProperty("--theme-accent", accentCandidate.toLowerCase());
              var hex = accentCandidate.slice(1);
              var red = parseInt(hex.slice(0, 2), 16) / 255;
              var green = parseInt(hex.slice(2, 4), 16) / 255;
              var blue = parseInt(hex.slice(4, 6), 16) / 255;
              var linearize = function(channel) {
                return channel <= 0.03928 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
              };
              var luminance = 0.2126 * linearize(red) + 0.7152 * linearize(green) + 0.0722 * linearize(blue);
              document.documentElement.style.setProperty("--theme-accent-foreground", luminance > 0.179 ? "#1c1917" : "#fffaf5");
            }
            var colorKeys = ["lightBackgroundColor", "lightForegroundColor", "darkBackgroundColor", "darkForegroundColor"];
            colorKeys.forEach(function(key) {
              var color = parsed && parsed.state && parsed.state[key];
              if (typeof color === "string" && /^#[0-9a-f]{6}$/i.test(color)) {
                document.documentElement.style.setProperty("--theme-" + key.replace("Color", "").replace(/([A-Z])/g, "-$1").toLowerCase(), color.toLowerCase());
              }
            });
            var state = parsed && parsed.state;
            var uiFonts = {
              "source-serif": '"Source Serif 4 Variable", "Noto Serif SC Variable", Georgia, "Songti SC", STSong, serif',
              "instrument-serif": '"Instrument Serif", "Noto Serif SC Variable", Georgia, "Songti SC", STSong, serif'
            };
            var codeFonts = {
              "cascadia": '"Cascadia Code", "SFMono-Regular", Consolas, monospace',
              "courier": '"Courier New", Courier, monospace'
            };
            if (state && uiFonts[state.uiFontFamily]) document.documentElement.style.setProperty("--theme-ui-font", uiFonts[state.uiFontFamily]);
            if (state && codeFonts[state.codeFontFamily]) document.documentElement.style.setProperty("--theme-code-font", codeFonts[state.codeFontFamily]);
            if (state && /^(400|500|600|700)$/.test(state.uiFontWeight)) document.documentElement.style.setProperty("--theme-ui-weight", state.uiFontWeight);
            if (state && /^(400|500|600|700)$/.test(state.codeFontWeight)) document.documentElement.style.setProperty("--theme-code-weight", state.codeFontWeight);
            if (state && typeof state.contrast === "number" && isFinite(state.contrast)) document.documentElement.style.setProperty("--theme-contrast", String(Math.max(0, Math.min(100, Math.round(state.contrast)))));
            if (state && state.sidebarTransparency === true) document.documentElement.classList.add("theme-sidebar-transparent");
          }
        } catch (_) {}
        if (!stored) {
          try {
            var legacy = localStorage.getItem("pcc-agent-theme");
            if (legacy === "light" || legacy === "dark" || legacy === "system") stored = legacy;
          } catch (_) {}
        }
        var isDark = stored === "dark"
          ? true
          : stored === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : false;
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
